# Конфигурация time-doctor. Программа только читает состояние и проверяет
# перечисленные ниже серверы; время она не меняет.
[probe]
# Серверы для проверки доступности (через пробел/запятую, HOST[:PORT]).
# Если пусто — проверяются серверы из конфигурации chrony/timesyncd/ntpd.
servers =
timeout = 2

[thresholds]
max_offset_ms = 100
